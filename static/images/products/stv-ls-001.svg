<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Nexstand K2 Foldable Ergonomic Laptop Riser">
  <defs>
    <linearGradient id="bg-STV-LS-001" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <pattern id="grid-STV-LS-001" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg-STV-LS-001)"/>
  <rect width="640" height="400" fill="url(#grid-STV-LS-001)"/>

  <!-- Top Brand & SKU Header -->
  <rect x="28" y="24" width="136" height="28" rx="14" fill="#ccfbf1"/>
  <text x="96" y="42" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">NEXSTAND</text>

  <text x="612" y="42" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">STV-LS-001</text>

  <!-- Vector Hardware Illustration -->
  
      <g stroke="#5eead4" stroke-width="5" stroke-linecap="round" fill="none">
        <line x1="160" y1="245" x2="310" y2="115"/>
        <line x1="480" y1="245" x2="330" y2="115"/>
        <line x1="205" y1="245" x2="365" y2="128"/>
        <line x1="435" y1="245" x2="275" y2="128"/>
        <line x1="145" y1="245" x2="495" y2="245" stroke="#94a3b8" stroke-width="4"/>
      </g>
      <circle cx="320" cy="122" r="7" fill="#f8fafc"/>
      <circle cx="235" cy="182" r="5" fill="#14b8a6"/>
      <circle cx="405" cy="182" r="5" fill="#14b8a6"/>
    

  <!-- Bottom Product Label Strip -->
  <rect x="0" y="318" width="640" height="82" fill="rgba(15,23,42,0.78)"/>
  <line x1="0" y1="318" x2="640" y2="318" stroke="#14b8a6" stroke-width="2"/>
  <text x="32" y="352" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Nexstand K2 Foldable Ergonomic Laptop Riser</text>
  <text x="32" y="376" fill="#14b8a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">SETUVO CURATED WORKSTATION HARDWARE</text>
</svg>
