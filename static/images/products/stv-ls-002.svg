<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="UGREEN Unibody Aluminum Ventilated Laptop Stand">
  <defs>
    <linearGradient id="bg-STV-LS-002" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#134e4a"/>
    </linearGradient>
    <pattern id="grid-STV-LS-002" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="640" height="400" fill="url(#bg-STV-LS-002)"/>
  <rect width="640" height="400" fill="url(#grid-STV-LS-002)"/>

  <!-- Top Brand & SKU Header -->
  <rect x="28" y="24" width="136" height="28" rx="14" fill="#ccfbf1"/>
  <text x="96" y="42" text-anchor="middle" fill="#0f172a" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">UGREEN</text>

  <text x="612" y="42" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="13" font-weight="700">STV-LS-002</text>

  <!-- Vector Hardware Illustration -->
  
      <path d="M180 245 L455 245 L430 228 L230 228 L390 120 L465 135 L472 120 L382 102 L180 232 Z"
            fill="#cbd5e1" stroke="#f8fafc" stroke-width="2"/>
      <rect x="260" y="160" width="90" height="8" rx="4" transform="rotate(-33 260 160)" fill="#0f172a"/>
      <line x1="150" y1="247" x2="490" y2="247" stroke="#5eead4" stroke-width="3"/>
    

  <!-- Bottom Product Label Strip -->
  <rect x="0" y="318" width="640" height="82" fill="rgba(15,23,42,0.78)"/>
  <line x1="0" y1="318" x2="640" y2="318" stroke="#14b8a6" stroke-width="2"/>
  <text x="32" y="352" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">UGREEN Unibody Aluminum Ventilated Laptop...</text>
  <text x="32" y="376" fill="#14b8a6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">SETUVO CURATED WORKSTATION HARDWARE</text>
